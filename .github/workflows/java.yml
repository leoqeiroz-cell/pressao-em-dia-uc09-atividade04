name: Compilar e testar Java
on: [push, pull_request]
jobs:
  verificar:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '23']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Compilar com todos os avisos tratados como erros
        run: |
          mkdir -p build/classes
          javac --release 17 -Xlint:all -Werror -encoding UTF-8 -d build/classes src/br/com/senac/pressao/*.java testes/TestesSistema.java testes/TestesInterface.java
      - name: Verificar validacao, persistencia e tabela
        run: java -Djava.awt.headless=true -cp build/classes TestesSistema
      - name: Verificar interface e acessibilidade
        run: xvfb-run -a java -cp build/classes TestesInterface
